AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Igor evidence-gated AWS coding worker

Parameters:
  DefaultModelId:
    Type: String
    Default: global.openai.gpt-5.6-terra
  SourceRepository:
    Type: String
    Default: https://github.com/ourlovelysystem/lovely-system-igor.git
  SourceRevision:
    Type: String
    Default: main

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  GeneratedExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/igor-job-*:*

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployGeneratedLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:igor-job-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt GeneratedExecutionRole.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${EvidenceBucket.Arn}/jobs/*

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunIgorJob
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${EvidenceBucket.Arn}/jobs/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/igor-job-*/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  WorkerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt WorkerRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: JOBS_TABLE
            Value: !Ref JobsTable
          - Name: EVIDENCE_BUCKET
            Value: !Ref EvidenceBucket
          - Name: GENERATED_EXECUTION_ROLE_ARN
            Value: !GetAtt GeneratedExecutionRole.Arn
          - Name: CLOUDFORMATION_ROLE_ARN
            Value: !GetAtt CloudFormationRole.Arn
          - Name: IGOR_SOURCE_REPOSITORY
            Value: !Ref SourceRepository
          - Name: IGOR_SOURCE_REVISION
            Value: !Ref SourceRevision
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - git clone --no-checkout "$IGOR_SOURCE_REPOSITORY" /tmp/igor
                - git -C /tmp/igor checkout "$IGOR_SOURCE_REVISION"
            build:
              commands:
                - PYTHONPATH=/tmp/igor/src/worker python3 /tmp/igor/src/worker/runner.py

  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ControlJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt WorkerProject.Arn

  ControlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt ControlRole.Arn
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          WORKER_PROJECT: !Ref WorkerProject
          DEFAULT_MODEL_ID: !Ref DefaultModelId

  ControlUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !GetAtt ControlFunction.Arn

  ControlUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ControlFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root

  ControlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlFunction
      InvokedViaFunctionUrl: true
      Principal: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root

Outputs:
  IgorUrl:
    Description: IAM-authenticated Igor control URL
    Value: !GetAtt ControlUrl.FunctionUrl
  JobsTableName:
    Value: !Ref JobsTable
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  WorkerProjectName:
    Value: !Ref WorkerProject
