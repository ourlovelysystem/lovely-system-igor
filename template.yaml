AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Igor evidence-gated AWS coding worker

Parameters:
  DefaultModelId:
    Type: String
    Default: global.openai.gpt-5.6-terra
  SourceRepository:
    Type: String
    Default: https://github.com/ourlovelysystem/lovely-system-igor.git
  SourceRevision:
    Type: String
    Default: main
  GitHubTokenSecretName:
    Type: String
    Default: ""
    Description: Optional Secrets Manager secret containing Igor's GitHub token
  TelephoneAuthSecretName:
    Type: String
    Default: igor/telephone-auth
    Description: Runtime-only caller allowlist and PIN secret name
  TelephoneLexBotAliasArn:
    Type: String
    Default: ""
    Description: Lex V2 alias ARN configured after bot provisioning

Conditions:
  HasGitHubCredentials: !Not [!Equals [!Ref GitHubTokenSecretName, ""]]

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversation_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: conversation_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteAttachmentUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  GeneratedExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/igor-job-*:*

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployGeneratedLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:igor-job-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt GeneratedExecutionRole.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${EvidenceBucket.Arn}/jobs/*

  WorkloadRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Existing role Igor may pass to operator-directed workloads
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ecs-tasks.amazonaws.com
                - events.amazonaws.com
                - lambda.amazonaws.com
                - scheduler.amazonaws.com
                - states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  WorkloadInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WorkloadRole

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunIgorJob
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${EvidenceBucket.Arn}/jobs/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${EvidenceBucket.Arn}/attachments/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/igor-job-*/*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CloudFormationRole.Arn
                  - !GetAtt WorkloadRole.Arn
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService:
                      - cloudformation.amazonaws.com
                      - ec2.amazonaws.com
                      - ecs-tasks.amazonaws.com
                      - events.amazonaws.com
                      - lambda.amazonaws.com
                      - scheduler.amazonaws.com
                      - states.amazonaws.com

  WorkerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt WorkerRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: JOBS_TABLE
            Value: !Ref JobsTable
          - Name: CONVERSATIONS_TABLE
            Value: !Ref ConversationsTable
          - Name: EVIDENCE_BUCKET
            Value: !Ref EvidenceBucket
          - Name: GENERATED_EXECUTION_ROLE_ARN
            Value: !GetAtt GeneratedExecutionRole.Arn
          - Name: CLOUDFORMATION_ROLE_ARN
            Value: !GetAtt CloudFormationRole.Arn
          - Name: WORKLOAD_ROLE_ARN
            Value: !GetAtt WorkloadRole.Arn
          - Name: WORKLOAD_INSTANCE_PROFILE
            Value: !Ref WorkloadInstanceProfile
          - Name: IGOR_SOURCE_REPOSITORY
            Value: !Ref SourceRepository
          - Name: IGOR_SOURCE_REVISION
            Value: !Ref SourceRevision
          - !If
            - HasGitHubCredentials
            - Name: GITHUB_TOKEN_SECRET_NAME
              Value: !Ref GitHubTokenSecretName
            - !Ref AWS::NoValue
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - git clone --no-checkout "$IGOR_SOURCE_REPOSITORY" /tmp/igor
                - git -C /tmp/igor checkout "$IGOR_SOURCE_REVISION"
                - python3 /tmp/igor/scripts/github-credential.py configure
            build:
              commands:
                - PYTHONPATH=/tmp/igor/src/worker python3 /tmp/igor/src/worker/runner.py

  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ControlJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt WorkerProject.Arn

  ControlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt ControlRole.Arn
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          WORKER_PROJECT: !Ref WorkerProject
          DEFAULT_MODEL_ID: !Ref DefaultModelId

  ControlUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !GetAtt ControlFunction.Arn

  ControlUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ControlFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root

  ControlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlFunction
      InvokedViaFunctionUrl: true
      Principal: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root

  TelephoneCallsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: call_id
          AttributeType: S
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: call_id
          KeyType: HASH
        - AttributeName: record_key
          KeyType: RANGE
      Tags:
        - Key: igor:job-id
          Value: a1a99b2dcd1c4bb1894374cabad5ba93

  TelephoneRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TelephoneRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt TelephoneCallsTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TelephoneAuthSecretName}-*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: [!GetAtt ConversationFunction.Arn, !GetAtt ControlFunction.Arn]

  VoiceAdapterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/telephone/
      Handler: app.handler
      FunctionName: !Sub ${AWS::StackName}-voice-adapter
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt TelephoneRole.Arn
      Environment:
        Variables:
          TELEPHONE_CALLS_TABLE: !Ref TelephoneCallsTable
          TELEPHONE_AUTH_SECRET_NAME: !Ref TelephoneAuthSecretName
          LEX_BOT_ALIAS_ARN: !GetAtt IgorLexBotAlias.Arn
          CONVERSATION_FUNCTION_NAME: !Ref ConversationFunction
          CONTROL_FUNCTION_NAME: !Ref ControlFunction

  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lexv2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeIgorTelephoneFulfillment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-voice-adapter

  IgorLexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: !Sub ${AWS::StackName}-telephone-igor
      Description: Telephone speech transport for the existing Igor conversation engine
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy: {ChildDirected: false}
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.40
          VoiceSettings: {VoiceId: Joanna}
          Intents:
            - Name: IgorRelayIntent
              Description: Routes recognized telephone utterances to Igor without canned answers
              SampleUtterances:
                - Utterance: ask Igor {request}
                - Utterance: Igor {request}
                - Utterance: please {request}
              Slots:
                - Name: request
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting: {SlotConstraint: Optional}
              SlotPriorities:
                - Priority: 1
                  SlotName: request
              FulfillmentCodeHook: {Enabled: true}
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
              Description: Routes uncategorized telephone utterances to Igor
              FulfillmentCodeHook: {Enabled: true}

  IgorLexBotVersion2:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref IgorLexBot
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails: {SourceBotVersion: DRAFT}

  IgorLexBotAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotAliasName: active
      BotId: !Ref IgorLexBot
      BotVersion: !GetAtt IgorLexBotVersion2.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-voice-adapter"
                CodeHookInterfaceVersion: "1.0"

  ChimePstnVoiceAdapterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VoiceAdapterFunction
      Principal: voiceconnector.chime.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  LexVoiceAdapterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VoiceAdapterFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !GetAtt IgorLexBot.Arn

  ConversationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConverseAndUseBoundedTools
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${EvidenceBucket.Arn}/attachments/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ControlFunction.Arn

  ConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/conversation/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 90
      Role: !GetAtt ConversationRole.Arn
      Environment:
        Variables:
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          CONTROL_FUNCTION_NAME: !Ref ControlFunction
          DEFAULT_MODEL_ID: !Ref DefaultModelId
          ATTACHMENTS_BUCKET: !Ref EvidenceBucket

  OperatorPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-operators
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7

  OperatorClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OperatorPool
      ClientName: igor-dashboard
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  DashboardApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-dashboard-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - DELETE
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - "*"
        MaxAge: 3600

  DashboardAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref OperatorClient
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${OperatorPool}
      Name: igor-operators

  DashboardIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DashboardApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ControlFunction.Arn
      PayloadFormatVersion: "2.0"

  ConversationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DashboardApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ConversationFunction.Arn
      PayloadFormatVersion: "2.0"

  DashboardListJobsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: GET /jobs
      Target: !Sub integrations/${DashboardIntegration}

  DashboardSubmitJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /jobs
      Target: !Sub integrations/${DashboardIntegration}

  DashboardGetJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: GET /jobs/{job_id}
      Target: !Sub integrations/${DashboardIntegration}

  DashboardHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: GET /health
      Target: !Sub integrations/${DashboardIntegration}

  DashboardListConversationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: GET /conversations
      Target: !Sub integrations/${ConversationIntegration}

  DashboardCreateConversationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations
      Target: !Sub integrations/${ConversationIntegration}

  DashboardGetConversationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: GET /conversations/{conversation_id}
      Target: !Sub integrations/${ConversationIntegration}

  DashboardSendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations/{conversation_id}/messages
      Target: !Sub integrations/${ConversationIntegration}

  DashboardInitiateAttachmentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations/{conversation_id}/attachments
      Target: !Sub integrations/${ConversationIntegration}

  DashboardAttachmentPartUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations/{conversation_id}/attachments/{attachment_id}/part-url
      Target: !Sub integrations/${ConversationIntegration}

  DashboardAttachmentPartUrlsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations/{conversation_id}/attachments/{attachment_id}/part-urls
      Target: !Sub integrations/${ConversationIntegration}

  DashboardCompleteAttachmentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: POST /conversations/{conversation_id}/attachments/{attachment_id}/complete
      Target: !Sub integrations/${ConversationIntegration}

  DashboardCancelAttachmentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      AuthorizationType: JWT
      AuthorizerId: !Ref DashboardAuthorizer
      RouteKey: DELETE /conversations/{conversation_id}/attachments/{attachment_id}
      Target: !Sub integrations/${ConversationIntegration}

  DashboardStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DashboardApi
      StageName: $default
      AutoDeploy: true

  DashboardApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardApi}/*

  ConversationApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConversationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardApi}/*

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/dashboard/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          DASHBOARD_API_URL: !GetAtt DashboardApi.ApiEndpoint
          COGNITO_CLIENT_ID: !Ref OperatorClient
          COGNITO_REGION: !Ref AWS::Region

  DashboardUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt DashboardFunction.Arn

  DashboardUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref DashboardFunction
      FunctionUrlAuthType: NONE
      Principal: "*"

  DashboardInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DashboardFunction
      InvokedViaFunctionUrl: true
      Principal: "*"

Outputs:
  IgorUrl:
    Description: IAM-authenticated Igor control URL
    Value: !GetAtt ControlUrl.FunctionUrl
